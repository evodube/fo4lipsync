[General]
bEnabled=1
; 1 = log every finished line with the engine-vs-real lip clock speed
bDebugLog=0

[Sync]
; Advance the mouth animation by real time instead of the engine's frame time,
; so lips stay on the voice at high or uneven frame rates.
bFixLipTime=1
; Same for the timer that decides when a line is finished
; (stops NPCs talking over themselves or cutting lines short).
bFixVoiceTimer=1
; Experimental: also fix the actor's secondary voice timer.
bFixActorVoiceTimer=0
; Real-time gaps longer than this (seconds) while the game is paused are ignored.
fMaxStep=0.25
; Shift the mouth against the audio in seconds (+ = mouth earlier, - = mouth later).
fLipOffset=0.0

[Smoothing]
; Soften the steps between mouth shapes in the lip data.
bSmoothMouth=1
; 0 = vanilla mouth shapes, 1 = fully smoothed.
fSmoothing=0.6
; Blur width in lip-file frames (higher = softer, less crisp consonants).
fSmoothRadius=1.25
